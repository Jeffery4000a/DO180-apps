<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drop Merge — Web Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #060610;
    --accent: #7c4dff;
    --cyan:   #00d4ff;
    --gold:   #ffd700;
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    overflow-x: hidden;
    transition: background 0.5s ease;
  }
  body.gold-rush { background: #181000; }
  body.danger    { background: #120608; }

  /* ── Header ── */
  #header {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .score-block { display: flex; flex-direction: column; gap: 2px; min-width: 100px; }
  .score-label { font-size: 10px; font-weight: 700; color: #555; letter-spacing: 1.5px; }
  .score-value { font-size: 22px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; transition: color 0.3s; }
  body.gold-rush .score-value { color: var(--gold); }

  #mode-title { font-size: 13px; font-weight: 900; color: var(--accent); letter-spacing: 3px; transition: color 0.3s; }
  #mode-title.rush   { color: var(--gold);  animation: titlePulse 0.8s ease infinite; }
  #mode-title.danger { color: #ff1744;      animation: titlePulse 0.6s ease infinite; }
  @keyframes titlePulse { 50% { opacity: 0.5; } }

  #undo-btn {
    background: rgba(255,255,255,0.07); border: none; border-radius: 10px;
    padding: 6px 12px; cursor: pointer; color: #fff; font-size: 18px;
    display: flex; flex-direction: column; align-items: center;
  }
  #undo-btn span { font-size: 10px; color: #888; font-weight: 700; }
  #undo-btn:disabled { opacity: 0.3; cursor: default; }

  /* ── Gold Rush meter ── */
  #meter-row {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px 0;
  }
  #meter-icon { font-size: 14px; }
  #meter-track {
    flex: 1; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.06); overflow: hidden;
  }
  #meter-fill {
    height: 8px; border-radius: 4px; width: 0%;
    background: linear-gradient(90deg, #ff7700, var(--gold));
    transition: width 0.3s ease;
  }
  body.gold-rush #meter-fill { background: var(--gold); }
  #meter-label { font-size: 10px; font-weight: 800; color: #666; letter-spacing: 1.5px; min-width: 72px; text-align: right; }
  body.gold-rush #meter-label { color: var(--gold); }

  /* ── Controls row ── */
  #controls {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; gap: 12px;
  }
  .tile-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .preview-label { font-size: 10px; font-weight: 700; color: #555; letter-spacing: 1px; }

  /* ── Grid frame ── */
  #grid-wrapper {
    width: 100%; max-width: 420px;
    display: flex; justify-content: center;
    padding: 0 8px;
  }
  #grid-frame {
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 3px;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  body.gold-rush #grid-frame { border-color: var(--gold); box-shadow: 0 0 24px #ffd70044; animation: framePulse 1.2s ease infinite; }
  body.danger    #grid-frame { border-color: #ff1744;     box-shadow: 0 0 18px #ff174433; }
  @keyframes framePulse { 50% { box-shadow: 0 0 40px #ffd70077; } }

  #grid-frame.shake { animation: shake 0.22s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    50% { transform: translateX(7px); }
    75% { transform: translateX(-4px); }
  }

  #grid { display: grid; grid-template-columns: repeat(6, 1fr); }
  .column { display: flex; flex-direction: column; cursor: pointer; }
  .column:hover .drop-indicator { opacity: 1; }
  .column.full { cursor: not-allowed; }
  .column.bomb-mode:not(.full) { cursor: crosshair; }

  .drop-indicator {
    height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--accent); opacity: 0.5;
    transition: opacity 0.15s;
  }
  body.gold-rush .drop-indicator { color: var(--gold); }
  .drop-indicator.full-mark { color: #ff1744; opacity: 0.8; font-weight: 900; }
  .drop-indicator.bomb-mark { color: #ff3300; opacity: 1; }

  .cell {
    width: var(--tile, 50px); height: var(--tile, 50px);
    border-radius: 5px; margin: 1px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-variant-numeric: tabular-nums;
    background: #0a0a16; position: relative;
  }
  .cell.merging  { animation: mergePop 0.28s ease; }
  .cell.dropping { animation: dropIn 0.12s ease; }
  @keyframes mergePop { 40% { transform: scale(1.35); } }
  @keyframes dropIn   { 0% { transform: scaleY(0.6) translateY(-10px); opacity: 0.5; } }

  .cell.wild {
    background: #2a1f00 !important;
    border: 2px solid var(--gold) !important;
    color: var(--gold) !important;
    box-shadow: 0 0 12px #ffd70088 !important;
    animation: wildGlow 1s ease infinite;
  }
  @keyframes wildGlow { 50% { box-shadow: 0 0 22px #ffd700cc !important; } }

  /* ── Combo badge ── */
  #combo-badge {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50px; padding: 5px 18px;
    font-size: 15px; font-weight: 900; letter-spacing: 1px;
    display: none; z-index: 50; pointer-events: none;
  }
  #combo-badge.show { display: block; animation: comboPop 0.3s ease; }
  @keyframes comboPop { 0% { transform: translateX(-50%) scale(0.4); } 70% { transform: translateX(-50%) scale(1.15); } }

  /* ── Particles ── */
  .particle {
    position: fixed; width: 6px; height: 6px; border-radius: 3px;
    pointer-events: none; z-index: 99;
    animation: particleFly 0.5s ease forwards;
  }
  @keyframes particleFly {
    to { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }

  /* ── Score float ── */
  .score-float {
    position: fixed; pointer-events: none;
    font-size: 18px; font-weight: 900;
    text-shadow: 0 0 6px #000;
    animation: floatUp 0.75s ease forwards;
    z-index: 100;
  }
  @keyframes floatUp { to { opacity: 0; transform: translateY(-55px); } }

  /* ── Gold rush splash ── */
  #rush-splash {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: radial-gradient(circle, #ffd70033, transparent 70%);
    z-index: 150; pointer-events: none;
  }
  #rush-splash.show { display: flex; animation: splashFade 1.6s ease forwards; }
  #rush-splash .splash-text {
    font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: 4px;
    text-shadow: 0 0 30px #ffd700;
    animation: splashZoom 1.6s ease;
  }
  #rush-splash .splash-sub { font-size: 16px; color: #fff; margin-top: 8px; font-weight: 700; }
  @keyframes splashFade { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes splashZoom { 0% { transform: scale(0.3); } 30% { transform: scale(1.15); } 45% { transform: scale(1); } }

  /* ── Hint / bomb / banner ── */
  #hint { padding: 8px 16px; font-size: 12px; color: #333; text-align: center; width: 100%; max-width: 420px; }
  body.gold-rush #hint { color: var(--gold); }

  #bomb-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 8px 14px; cursor: pointer; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    font-size: 22px; min-width: 58px;
  }
  #bomb-btn span { font-size: 10px; color: #888; font-weight: 700; }
  #bomb-btn.active { background: rgba(255,51,0,0.15); border-color: #ff3300; }

  #ad-banner {
    width: 100%; max-width: 420px; height: 50px;
    background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #333; letter-spacing: 1px; margin-top: auto;
  }

  /* ── Game Over overlay ── */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(6,6,16,0.92); backdrop-filter: blur(8px);
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 200; gap: 14px;
  }
  #overlay.visible { display: flex; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } }

  .go-emoji { font-size: 64px; }
  .go-title { font-size: 28px; font-weight: 900; letter-spacing: 3px; }
  .go-score-label { font-size: 12px; font-weight: 700; color: #555; letter-spacing: 2px; }
  .go-score { font-size: 64px; font-weight: 900; color: var(--accent); line-height: 1; }
  .best-tile-box {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 16px 24px;
  }
  .best-tile-label { font-size: 10px; font-weight: 700; color: #555; letter-spacing: 1.5px; }
  .best-tile-mini {
    width: 54px; height: 54px; border-radius: 8px; border: 2px solid;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900;
  }
  .play-again-btn {
    background: linear-gradient(90deg, var(--accent), var(--cyan));
    border: none; border-radius: 50px; padding: 18px 48px;
    font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 3px;
    cursor: pointer; width: 80%; max-width: 300px;
  }
</style>
</head>
<body>

<div id="header">
  <div class="score-block">
    <span class="score-label">SCORE</span>
    <span class="score-value" id="score-display">0</span>
  </div>
  <span id="mode-title">DROP MERGE</span>
  <button id="undo-btn" title="Undo last move">↩<span id="undo-label">×3</span></button>
</div>

<div id="meter-row">
  <span id="meter-icon">🔥</span>
  <div id="meter-track"><div id="meter-fill"></div></div>
  <span id="meter-label">GOLD RUSH</span>
</div>

<div id="controls">
  <div class="tile-preview">
    <span class="preview-label">NEXT</span>
    <div class="cell" id="next-preview" style="width:42px;height:42px;font-size:14px;border-radius:6px;"></div>
  </div>
  <div class="tile-preview">
    <span class="preview-label">NOW</span>
    <div class="cell" id="current-preview" style="width:52px;height:52px;font-size:16px;border-radius:6px;"></div>
  </div>
  <button id="bomb-btn" title="Bomb power-up">💣<span id="bomb-label">ADS</span></button>
</div>

<div id="grid-wrapper">
  <div id="grid-frame">
    <div id="combo-badge"></div>
    <div id="grid"></div>
  </div>
</div>

<div id="hint">Chain merges to fill the Gold Rush meter</div>
<div id="ad-banner">[ BANNER AD — Google AdMob ]</div>

<div id="rush-splash">
  <span class="splash-text">★ GOLD RUSH ★</span>
  <span class="splash-sub">5 wildcards · all scores ×3</span>
</div>

<div id="overlay">
  <span class="go-emoji" id="go-emoji">💀</span>
  <span class="go-title" id="go-title">GAME OVER</span>
  <span class="go-score-label">SCORE</span>
  <span class="go-score" id="go-score">0</span>
  <div class="best-tile-box">
    <span class="best-tile-label">BEST TILE REACHED</span>
    <div class="best-tile-mini" id="go-best-tile"></div>
  </div>
  <button class="play-again-btn" onclick="initGame()">PLAY AGAIN</button>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const COLS = 6, ROWS = 12;
const WILD_COUNT = 5, RUSH_MULT = 3, MAX_COMBO = 5, METER_MAX = 100;
const COMBO_COLORS = ['#00d4ff','#00d4ff','#7c4dff','#ff7700','#ffd700','#ffd700'];

const TILE_COLORS = {
  2:    { bg:'#0d2137', glow:'#00aaff', text:'#fff' },
  4:    { bg:'#0a2e1f', glow:'#00ff88', text:'#fff' },
  8:    { bg:'#2e1a00', glow:'#ffaa00', text:'#fff' },
  16:   { bg:'#2e1800', glow:'#ff7700', text:'#fff' },
  32:   { bg:'#3a0d0d', glow:'#ff3300', text:'#fff' },
  64:   { bg:'#2a0a35', glow:'#cc00ff', text:'#fff' },
  128:  { bg:'#180a35', glow:'#7700ff', text:'#e0d4ff' },
  256:  { bg:'#080f35', glow:'#0044ff', text:'#c4d4ff' },
  512:  { bg:'#001a1a', glow:'#00ffff', text:'#b0ffff' },
  1024: { bg:'#1a1a00', glow:'#ffee00', text:'#fff176' },
  2048: { bg:'#2a1400', glow:'#ffd700', text:'#ffd700' },
};

const SPAWN_TABLE = [[2,45],[4,30],[8,15],[16,7],[32,3]];
const TOTAL_W = SPAWN_TABLE.reduce((s,[,w])=>s+w,0);
function randTileVal() {
  let r = Math.random() * TOTAL_W;
  for (const [v,w] of SPAWN_TABLE) { if (r < w) return v; r -= w; }
  return 2;
}

// ── Game state ─────────────────────────────────────────────────────────────
let grid, score, shownScore, current, next, undosLeft, bombMode, bombAvail;
let prevGrid, prevScore, prevCurrent;
let combo, meter, goldRush, wildLeft;
let gameOver, highScore = 0;
let scoreTicker = null;

const WILD = 'WILD';

function initGame() {
  grid = Array.from({length: COLS}, () => []);
  score = 0; shownScore = 0;
  current = randTileVal(); next = randTileVal();
  undosLeft = 3; bombMode = false; bombAvail = false;
  prevGrid = null; gameOver = false;
  combo = 0; meter = 0; goldRush = false; wildLeft = 0;

  document.body.classList.remove('gold-rush','danger');
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('combo-badge').classList.remove('show');
  document.getElementById('bomb-label').textContent = 'ADS';
  setHint();
  render();
}

// ── Drop & merge ───────────────────────────────────────────────────────────
function drop(col) {
  if (gameOver) return;
  if (grid[col].length >= ROWS) return;
  if (bombMode) { execBomb(col); return; }

  prevGrid = grid.map(c => [...c]);
  prevScore = score;
  prevCurrent = current;

  // Wildcard adopts the column's top value so the merge loop fuses them
  const isWild = current === WILD;
  const top = grid[col][grid[col].length - 1];
  const value = isWild ? (top ?? 2) : current;
  grid[col].push(value);

  // Cascade merge
  let mergedScore = 0, chainLen = 0, formed2048 = false;
  while (grid[col].length >= 2) {
    const a = grid[col][grid[col].length - 1];
    const b = grid[col][grid[col].length - 2];
    if (a !== b) break;
    const merged = a * 2;
    grid[col].pop();
    grid[col][grid[col].length - 1] = merged;
    mergedScore += merged;
    chainLen++;
    if (merged === 2048) { mergedScore += 4096; grid[col].pop(); formed2048 = true; break; }
  }

  // Combo + multipliers
  const didMerge = mergedScore > 0;
  combo = didMerge ? combo + 1 : 0;
  const comboMult = didMerge ? Math.min(combo, MAX_COMBO) : 1;
  const rushMult = goldRush ? RUSH_MULT : 1;
  const gained = mergedScore * comboMult * rushMult;
  score += gained;

  updateCombo();

  // Gold Rush meter
  let rushTriggered = false;
  if (!goldRush && didMerge) {
    meter = Math.min(METER_MAX, meter + chainLen * 16 + 6);
    if (meter >= METER_MAX) { rushTriggered = true; meter = 0; }
  }

  // FX
  if (didMerge) {
    const color = goldRush ? '#ffd700' : COMBO_COLORS[Math.min(combo, 5)];
    const label = comboMult > 1 ? `+${gained.toLocaleString()} ×${comboMult}` : `+${gained.toLocaleString()}`;
    floatScore(col, label, color);
    spawnParticles(col, grid[col].length - 1, TILE_COLORS[grid[col][grid[col].length-1]] ?.glow ?? '#ffd700');
    if (chainLen >= 2 || formed2048) shakeGrid();
  }

  // Advance queue (gold rush freezes the normal queue)
  if (isWild) wildLeft--;
  if (rushTriggered) {
    startGoldRush();
  } else if (wildLeft > 0) {
    current = WILD;
  } else {
    if (goldRush) endGoldRush();
    current = next;
    next = randTileVal();
  }

  render(col, didMerge ? grid[col].length - 1 : -1);

  if (grid.every(c => c.length >= ROWS)) triggerGameOver();
}

function startGoldRush() {
  goldRush = true; wildLeft = WILD_COUNT; current = WILD;
  document.body.classList.add('gold-rush');
  document.body.classList.remove('danger');
  const splash = document.getElementById('rush-splash');
  splash.classList.remove('show'); void splash.offsetWidth;
  splash.classList.add('show');
  setHint();
}
function endGoldRush() {
  goldRush = false;
  document.body.classList.remove('gold-rush');
  setHint();
}

function setHint() {
  const h = document.getElementById('hint');
  if (bombMode)       h.textContent = 'Tap a column to destroy its top tile';
  else if (goldRush)  h.textContent = `★ Wildcards merge with ANY tile — scores ×${RUSH_MULT}!`;
  else                h.textContent = 'Chain merges to fill the Gold Rush meter';
}

function updateCombo() {
  const badge = document.getElementById('combo-badge');
  if (combo >= 2) {
    badge.textContent = `COMBO ×${Math.min(combo, MAX_COMBO)}`;
    badge.style.color = COMBO_COLORS[Math.min(combo, 5)];
    badge.classList.remove('show'); void badge.offsetWidth;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function triggerGameOver() {
  gameOver = true;
  const bestTile = grid.flat().reduce((m,v) => Math.max(m,v), 2);
  const isRecord = score > highScore;
  if (isRecord) highScore = score;

  setTimeout(() => {
    const tc = TILE_COLORS[bestTile] || TILE_COLORS[2048];
    document.getElementById('go-emoji').textContent = isRecord ? '🏆' : '💀';
    document.getElementById('go-title').textContent = isRecord ? 'NEW RECORD!' : 'GAME OVER';
    document.getElementById('go-score').textContent = score.toLocaleString();
    const btEl = document.getElementById('go-best-tile');
    btEl.textContent = bestTile;
    btEl.style.background = tc.bg; btEl.style.borderColor = tc.glow; btEl.style.color = tc.text;
    document.getElementById('overlay').classList.add('visible');
  }, 500);
}

// ── Undo / Bomb ────────────────────────────────────────────────────────────
document.getElementById('undo-btn').addEventListener('click', () => {
  if (!prevGrid || gameOver || undosLeft <= 0) return;
  grid = prevGrid; score = prevScore; current = prevCurrent;
  undosLeft--; prevGrid = null; combo = 0;
  updateCombo(); render();
});

document.getElementById('bomb-btn').addEventListener('click', () => {
  if (gameOver) return;
  if (!bombAvail) {
    bombAvail = true; // RN app: rewarded ad here
    document.getElementById('bomb-label').textContent = 'USE';
  }
  bombMode = !bombMode;
  document.getElementById('bomb-btn').classList.toggle('active', bombMode);
  setHint();
  updateDropIndicators();
});

function execBomb(col) {
  if (grid[col].length === 0) return;
  grid[col].pop();
  bombMode = false; bombAvail = false;
  document.getElementById('bomb-btn').classList.remove('active');
  document.getElementById('bomb-label').textContent = 'ADS';
  setHint();
  render();
}

// ── FX ─────────────────────────────────────────────────────────────────────
function shakeGrid() {
  const f = document.getElementById('grid-frame');
  f.classList.remove('shake'); void f.offsetWidth;
  f.classList.add('shake');
}

function colCenter(col, stackIdx) {
  const colEl = document.querySelector(`.column[data-col="${col}"]`);
  if (!colEl) return null;
  const rect = colEl.getBoundingClientRect();
  const cellH = (rect.height - 24) / ROWS;
  const screenRow = ROWS - 1 - stackIdx;
  return { x: rect.left + rect.width / 2, y: rect.top + 24 + screenRow * cellH + cellH / 2 };
}

function spawnParticles(col, stackIdx, color) {
  const p = colCenter(col, stackIdx);
  if (!p) return;
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + 0.4;
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.background = color;
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.setProperty('--dx', Math.cos(a) * 34 + 'px');
    el.style.setProperty('--dy', Math.sin(a) * 34 + 'px');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 550);
  }
}

function floatScore(col, text, color) {
  const colEl = document.querySelector(`.column[data-col="${col}"]`);
  if (!colEl) return;
  const rect = colEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'score-float';
  el.textContent = text;
  el.style.color = color;
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 60 + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

// ── Render ─────────────────────────────────────────────────────────────────
function buildGrid() {
  const gridEl = document.getElementById('grid');
  gridEl.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.col = c;
    colEl.addEventListener('click', () => drop(c));
    const ind = document.createElement('div');
    ind.className = 'drop-indicator';
    ind.dataset.colInd = c;
    colEl.appendChild(ind);
    for (let r = 0; r < ROWS; r++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.col = c; cell.dataset.row = r;
      colEl.appendChild(cell);
    }
    gridEl.appendChild(colEl);
  }
}

function render(droppedCol = -1, mergeIdx = -1) {
  animateScore();
  updatePreviews();
  updateDropIndicators();
  updateMeter();
  updateDanger();

  document.getElementById('undo-btn').disabled = !prevGrid || undosLeft <= 0;
  document.getElementById('undo-label').textContent = undosLeft > 0 ? `×${undosLeft}` : '📺';

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const stackIdx = ROWS - 1 - r;
      const val = grid[c][stackIdx];
      const cell = document.querySelector(`.cell[data-col="${c}"][data-row="${r}"]`);
      if (!cell) continue;
      cell.className = 'cell';
      cell.textContent = '';
      cell.removeAttribute('style');
      if (val) {
        const tc = TILE_COLORS[val] || TILE_COLORS[2048];
        cell.style.cssText = `background:${tc.bg};border:1.5px solid ${tc.glow};color:${tc.text};box-shadow:0 0 6px ${tc.glow}55;font-size:${fontSize(val)}px`;
        cell.textContent = val;
        if (c === droppedCol && stackIdx === grid[c].length - 1) {
          cell.classList.add(stackIdx === mergeIdx ? 'merging' : 'dropping');
        }
      }
    }
  }
}

function animateScore() {
  clearInterval(scoreTicker);
  scoreTicker = setInterval(() => {
    if (shownScore >= score) { shownScore = score; clearInterval(scoreTicker); }
    else shownScore = Math.min(score, shownScore + Math.max(1, Math.ceil((score - shownScore) / 6)));
    document.getElementById('score-display').textContent = shownScore.toLocaleString();
  }, 28);
}

function updatePreviews() {
  applyTile(document.getElementById('current-preview'), current);
  applyTile(document.getElementById('next-preview'), next);
}

function applyTile(el, val) {
  el.classList.remove('wild');
  if (val === WILD) {
    el.removeAttribute('style');
    el.style.cssText = 'width:52px;height:52px;font-size:22px;border-radius:6px;';
    if (el.id === 'next-preview') el.style.cssText = 'width:42px;height:42px;font-size:18px;border-radius:6px;';
    el.classList.add('wild');
    el.textContent = '★';
    return;
  }
  const tc = TILE_COLORS[val] || TILE_COLORS[2048];
  const base = el.id === 'next-preview' ? 'width:42px;height:42px;border-radius:6px;' : 'width:52px;height:52px;border-radius:6px;';
  el.style.cssText = `${base}background:${tc.bg};border:1.5px solid ${tc.glow};color:${tc.text};box-shadow:0 0 8px ${tc.glow}66;font-size:${fontSize(val)+2}px`;
  el.textContent = val;
}

function updateDropIndicators() {
  for (let c = 0; c < COLS; c++) {
    const ind = document.querySelector(`[data-col-ind="${c}"]`);
    const colEl = document.querySelector(`.column[data-col="${c}"]`);
    if (!ind || !colEl) continue;
    const full = grid[c].length >= ROWS;
    colEl.classList.toggle('full', full);
    colEl.classList.toggle('bomb-mode', bombMode && !full);
    if (full)          { ind.textContent = '✕'; ind.className = 'drop-indicator full-mark'; }
    else if (bombMode) { ind.textContent = '💣'; ind.className = 'drop-indicator bomb-mark'; }
    else               { ind.textContent = '▼'; ind.className = 'drop-indicator'; }
  }
}

function updateMeter() {
  const fill = document.getElementById('meter-fill');
  const label = document.getElementById('meter-label');
  const icon = document.getElementById('meter-icon');
  if (goldRush) {
    fill.style.width = (wildLeft / WILD_COUNT * 100) + '%';
    label.textContent = `${wildLeft} WILD`;
    icon.textContent = '★';
  } else {
    fill.style.width = meter + '%';
    label.textContent = 'GOLD RUSH';
    icon.textContent = '🔥';
  }
}

function updateDanger() {
  const fullCols = grid.filter(c => c.length >= ROWS).length;
  const danger = !goldRush && fullCols >= 3;
  document.body.classList.toggle('danger', danger);
  const title = document.getElementById('mode-title');
  if (goldRush)     { title.textContent = '★ GOLD RUSH ★'; title.className = 'rush'; }
  else if (danger)  { title.textContent = '⚠ DANGER';      title.className = 'danger'; }
  else              { title.textContent = 'DROP MERGE';     title.className = ''; }
}

function fontSize(v) {
  if (v < 100)  return 15;
  if (v < 1000) return 12;
  return 10;
}

// ── Responsive sizing (CSS variable — survives render() style resets) ──────
function sizeTiles() {
  const w = Math.min(window.innerWidth, 420) - 22;
  const h = window.innerHeight - 230;
  const tileSize = Math.floor(Math.min(w / COLS, h / ROWS)) - 2;
  document.documentElement.style.setProperty('--tile', tileSize + 'px');
}

buildGrid();
initGame();
sizeTiles();
window.addEventListener('resize', sizeTiles);
</script>
</body>
